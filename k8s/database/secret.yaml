apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: three-tier
  labels:
    app: postgres
    tier: database
type: Opaque
# echo -n 'appuser' | base64  →  YXBwdXNlcg==
# echo -n 'apppass' | base64  →  YXBwcGFzcw==
# echo -n 'appdb'   | base64  →  YXBwZGI=
data:
  POSTGRES_USER:     YXBwdXNlcg==
  POSTGRES_PASSWORD: YXBwcGFzcw==
  POSTGRES_DB:       YXBwZGI=
